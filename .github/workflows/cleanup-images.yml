name: Cleanup Old Images

on:
  workflow_dispatch:
    inputs:
      delete_tag:
        description: Exact container tag whose package version should be deleted
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 6 * * 0'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE_NAME: ${{ github.event.repository.name }}
      RETAIN_COUNT: '5'
      DELETE_TAG: ${{ inputs.delete_tag || '' }}
    steps:
      - name: Delete old GHCR image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail

          package_endpoint_prefix="users"
          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            package_endpoint_prefix="orgs"
          fi

          encoded_package_name="${PACKAGE_NAME,,}"

          set +e
          versions_json=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/${package_endpoint_prefix}/${OWNER}/packages/container/${encoded_package_name}/versions?per_page=100" \
            --jq '.[]')
          status=$?
          set -e

          if (( status != 0 )); then
            echo "Container package ${OWNER}/${encoded_package_name} was not found. Nothing to clean up."
            exit 0
          fi

          if [[ -n "$DELETE_TAG" ]]; then
            mapfile -t requested_delete_ids < <(
              jq -sr --arg delete_tag "$DELETE_TAG" '
                .[] |
                select(.metadata.container.tags // [] | index($delete_tag)) |
                .id
              ' <<<"$versions_json"
            )

            if (( ${#requested_delete_ids[@]} == 0 )); then
              echo "No container package version has the exact tag ${DELETE_TAG}."
            else
              for version_id in "${requested_delete_ids[@]}"; do
                echo "Deleting package version ${version_id} with tag ${DELETE_TAG}"
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/${package_endpoint_prefix}/${OWNER}/packages/container/${encoded_package_name}/versions/${version_id}"
              done

              versions_json=$(gh api \
                --paginate \
                -H "Accept: application/vnd.github+json" \
                "/${package_endpoint_prefix}/${OWNER}/packages/container/${encoded_package_name}/versions?per_page=100" \
                --jq '.[]')
            fi
          fi

          mapfile -t delete_ids < <(
            jq -sr --argjson retain_count "$RETAIN_COUNT" '
              sort_by(.created_at) |
              reverse |
              to_entries[] |
              select(.key >= $retain_count) |
              select(
                [
                  .value.metadata.container.tags[]? |
                  test("^v?[0-9]+([.][0-9]+){0,2}([.-][0-9A-Za-z.-]+)?$")
                ] |
                any |
                not
              ) |
              .value.id
            ' <<<"$versions_json"
          )

          version_count=$(jq -sr 'length' <<<"$versions_json")
          if (( version_count <= RETAIN_COUNT )); then
            echo "Found ${version_count} image versions. Nothing to delete."
            exit 0
          fi

          if (( ${#delete_ids[@]} == 0 )); then
            echo "Found ${version_count} image versions, but no old unversioned versions to delete."
            exit 0
          fi

          for version_id in "${delete_ids[@]}"; do
            echo "Deleting package version ${version_id}"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/${package_endpoint_prefix}/${OWNER}/packages/container/${encoded_package_name}/versions/${version_id}"
          done
