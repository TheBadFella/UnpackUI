name: build-and-release
on:
  push:
    branches:
      - unstable
    tags:
      - v*
  workflow_dispatch:
    inputs:
      platforms:
        description: Docker platforms to build
        required: false
        default: linux/amd64
        type: string
      push_image:
        description: Push image to GHCR
        required: false
        default: true
        type: boolean
      extra_image_tag:
        description: Optional extra image tag to publish in addition to latest and the selected workflow ref, such as 1.0.0.
        required: false
        default: ''
        type: string
  pull_request:
    branches:
    - main
permissions:
  contents: read
jobs:

  docker-ghcr-build-push:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/unstable'
    name: Deploy GHCR Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Set up QEMU
        if: contains(github.event.inputs.platforms || '', 'arm')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: 'arm64'

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ghcr.io
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker image name
        id: image_name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image_name.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{version}},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{major}},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=ref,enable=${{ github.event_name != 'workflow_dispatch' }},event=branch

      - name: Collect manual Docker tags
        if: github.event_name == 'workflow_dispatch'
        id: manual_tags
        env:
          IMAGE: ${{ steps.image_name.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
          EXTRA_IMAGE_TAG: ${{ inputs.extra_image_tag }}
        run: |
          sanitize_tag() {
            printf '%s' "$1" |
              sed -E 's#^refs/(heads|tags)/##; s#[^A-Za-z0-9_.-]+#-#g; s#^-+|-+$##g' |
              tr '[:upper:]' '[:lower:]' |
              cut -c1-128
          }

          ref_tag="$(sanitize_tag "${REF_NAME}")"
          extra_tag="$(sanitize_tag "${EXTRA_IMAGE_TAG}")"

          {
            [[ -n "${ref_tag}" ]] && echo "${IMAGE}:${ref_tag}"
            [[ -n "${extra_tag}" ]] && echo "${IMAGE}:${extra_tag}"
            echo "${IMAGE}:latest"
          } | sort -u > /tmp/manual-docker-tags.txt

          {
            echo 'tags<<EOF'
            cat /tmp/manual-docker-tags.txt
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

          echo "Manual Docker tags:"
          cat /tmp/manual-docker-tags.txt

      - name: Set docker build-args
        run: >-
          git fetch --force --tags;
          source ./settings.sh;
          for item in DATE COMMIT VERSION ITERATION BRANCH LICENSE DESC VENDOR MAINT SOURCE_URL; do
            eval echo "settings.sh build-arg: ${item}=\$${item}";
            eval echo "${item}=\$${item}" >> $GITHUB_ENV;
          done

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          context: .
          file: init/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.manual_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ env.DATE }}
            COMMIT=${{ env.COMMIT }}
            VERSION=${{ env.VERSION }}
            ITERATION=${{ env.ITERATION }}
            BRANCH=${{ env.BRANCH }}
            LICENSE=${{ env.LICENSE }}
            DESC=${{ env.DESC }}
            VENDOR=${{ env.VENDOR }}
            AUTHOR=${{ env.MAINT }}
            SOURCE_URL=${{ env.SOURCE_URL }}
