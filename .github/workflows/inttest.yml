name: integration
on:
  push:
    branches:
      - main
      - unstable
      - master
  pull_request:
    branches:
      - main
      - unstable
      - master
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install archive tools
        run: |
          sudo apt update
          sudo apt install -y rar p7zip-full zip unzip
      - name: Build unpackerr
        run: go build -o unpackerr .
      - name: Clone integration tests
        run: |
          git clone https://github.com/Unpackerr/unpackerr-inttest.git inttest
          git -C inttest checkout c0586b22d42840d39fb774f7fbbf9971cbefda26
          # The fork discovers nested archives at startup and tracks each archive separately.
          git -C inttest apply --check "${GITHUB_WORKSPACE}/tests/upstream-inttest.patch"
          git -C inttest apply "${GITHUB_WORKSPACE}/tests/upstream-inttest.patch"
      - name: Integration tests
        working-directory: inttest
        env:
          UNPACKERR_BIN: ${{ github.workspace }}/unpackerr
        run: go test -tags=integration -timeout 5m -count=1 -v ./test/...
