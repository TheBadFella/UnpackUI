version: '2'
linters:
  default: all
  disable:
    # noisy / conflicting linters
    - tagalign
    - varnamelen
    - gochecknoglobals
    # unused
    - exhaustruct
    - exhaustruct_v5
    - exhaustive
    - dupl
    - nlreturn
    - tagliatelle
    - cyclop
    - testpackage
    - wsl
    - wsl_v5 # v2.13 successor of wsl, which upstream already disables.
    - embeddedstructfieldcheck # this is a trash rule.
    - funcorder # also lame.
    - noinlineerr # I like inline errors.
    - goconst # noisy af.
    - gomodguard # deprecated.

  settings:
    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - github.com/Unpackerr/unpackerr
            - github.com/lestrrat-go/apache-logformat
            - github.com/ncruces/zenity
            - github.com/energye/systray
            - github.com/mitchellh/go-homedir
            - github.com/fsnotify/fsnotify
            - github.com/radovskyb/watcher
            - github.com/prometheus/client_golang/
            - github.com/spf13/pflag
            - github.com/gorilla/securecookie
            - github.com/coder/websocket
            - github.com/BurntSushi/toml
            - golift.io
            - golang.org/x
            - gopkg.in/yaml.v3
            - code.cloudfoundry.org/bytefmt
            - github.com/dromara/carbon/v2

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: pkg/unpackerr/webhook\.go
        linters:
          - lll
      - path: pkg/unpackerr/webhooks_templates\.go
        linters:
          - lll
      - path: pkg/hooks/config\.go
        linters:
          - lll

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
